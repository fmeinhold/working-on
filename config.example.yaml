# Working On - example configuration
#
# Copy this to ~/.config/working_on/config.yaml and fill it in, or run
# `wo init` to be asked for the same things and have it written for you.
#
# Per repository overrides go in a .workingon.yaml beside your checkout; see
# the end of this file.

settings:
  # Day first dates, as in 6.8.2026.
  day_first: true

  # An IANA timezone name. Times you type are read in this zone, stored in UTC,
  # and displayed back in this zone.
  location: Europe/Berlin

  # Go reference layouts - https://pkg.go.dev/time#pkg-constants
  # The layout also decides how partial dates are read: with "2.1.2006",
  # "6.8" is the 6th of August and "6" is the 6th of this month.
  date_layout: "2.1.2006"
  date_time_layout: "2.1.2006 15:04"

  # From https://track.toggl.com/profile
  toggl_api_token: <your toggl api token>

  # The workspace new entries are created in. `wo init` picks this for you.
  toggl_wid: 0

  # A time entry's project is resolved in this order:
  #   1. the project the task belongs to, for an entry that ended up with one
  #   2. the --project flag, which is either a toggl project id or the name of
  #      a project in this workspace  (wo add --project "SW Biz Dev" ...)
  #   3. toggl_default_pid
  # The task leads because it belongs to exactly one project, and toggl refuses
  # an entry filing it under another - so where the two disagree, only the task
  # can be honoured. An entry with no task takes the rest as written.
  #
  # If none of those produce one, toggl_pid_required decides whether that is
  # an error or an entry with no project. A --project naming a project the
  # workspace does not have is an error rather than a fall back to the default.
  #
  # Its task, in this order:
  #   1. the --task flag, by id or by name
  #   2. a task named as the summary  (wo add "ATD Conference" 2h)
  #   3. a task referenced by id      (wo add 241929955 2h)
  #   4. toggl_default_task, for an entry that landed in toggl_default_pid
  # Task names are matched exactly, case insensitively, and only within the
  # project already resolved - so a description is never mistaken for a task.
  toggl_pid_required: true
  toggl_default_pid: 0

  # Some workspaces want a task on every entry. Where that holds, `wo` asks
  # which one - listing the project's tasks - rather than creating an entry
  # toggl will refuse. --pick-task asks even where it does not, and --task or
  # WO_TOGGL_TASK answers without being asked.
  toggl_task_required: false

  # The task an entry falls back to. It only applies to entries that landed in
  # toggl_default_pid, since that is the project it belongs to - usually it is
  # set per checkout in a .workingon.yaml rather than here.
  toggl_default_task: 0

  # What to call an entry that has no description. A toggl workspace can be set
  # up to require one, and that applies to the timer already running as much as
  # to the entry you are creating - starting or stopping something saves it.
  # Left empty, `wo` asks; a run with nowhere to ask calls it "Untitled".
  toggl_default_description: ""


# Time entry templates, addressed by their alias: `wo add ds` books the daily
# standup. Descriptions are Go templates, filled from --templateArgs:
#
#   wo add call -t caller=Sam
#
# see https://pkg.go.dev/text/template
#
# A placeholder no argument answers for is asked about before the entry is
# booked. A run with nobody to ask - a script, a cron job - renders it as
# "<no value>" instead.
#
# toggl_pid and toggl_task pin where the entry lands. Both are optional: an
# entry from a template that names neither is filed the way any other entry is.
# An explicit --task still overrides the task, and --project the project of a
# template that pins no task.
#
# A template pinning a task lands in that task's own project, whatever
# toggl_pid or toggl_default_pid say - see the resolution order above.
#
# start and stop are read with the layouts above, and the duration follows from
# the pair. Times without a date mean today.
templates:
  - alias: "ds"
    description: "Daily Standup"
    toggl_pid: 12345678
    toggl_task: 87654321
    start: "17:30"
    stop: "17:45"

  - alias: "call"
    description: "Call with {{.caller}}"


# How `wo sanitize` tidies a day: it rounds ragged times off and hands the gaps
# between entries to whichever entry they belong to. A gap before a short entry
# is that entry's; every other gap goes to the entry that ran into it.
#
# no_work are the hours nothing may be stretched into. A gap over one of them
# stays a gap, and an entry that genuinely overlaps one is left as it is.
#
# snap and short are durations. Leave one out for the default shown here; write
# "0" to turn that part of the tidying off.
sanitize:
  snap: "5m"
  short: "15m"
  no_work: []


# Configuration for task sources other than toggl. Toggl is built in and takes
# its credentials from settings above, so this is empty until another source
# exists.
sources: {}


# Per repository overrides
# ------------------------
# A .workingon.yaml in a checkout is merged over this file, so it only needs
# the keys it changes. `wo init` writes one for you once this file exists:
#
#   settings:
#     toggl_default_pid: 987654
#     toggl_default_task: 123456
#
# It is looked for from the working directory upwards, stopping at the
# repository root. Credentials are ignored there: a checked in overlay cannot
# change which account you authenticate as. Note that a list replaces the one
# it overrides rather than adding to it.
